<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="담픽 공동구매 주문조회"
  >

  <title>담픽 공동구매 주문조회</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --main: #ef3f7f;
      --main-dark: #d92d69;
      --main-light: #fff0f5;
      --text: #252525;
      --subtext: #777;
      --border: #e8e8e8;
      --success: #17864b;
      --warning: #d47b00;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
      color: var(--text);
      background:
        linear-gradient(
          180deg,
          #fff0f5 0%,
          #fff9fb 50%,
          #fff 100%
        );
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 18px 50px;
    }

    .brand {
      margin-bottom: 27px;
      text-align: center;
    }

    .brand-title {
      margin: 0;
      color: var(--main);
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand-title span {
      margin-left: 5px;
      color: var(--main-dark);
      font-size: 19px;
    }

    .brand-slogan {
      margin: 9px 0 0;
      color: var(--subtext);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.55;
    }

    .card {
      padding: 28px 22px;
      border: 1px solid rgba(239, 63, 127, 0.12);
      border-radius: 23px;
      background: #fff;
      box-shadow:
        0 14px 38px rgba(129, 61, 85, 0.12);
    }

    .card-title {
      margin: 0;
      text-align: center;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.7px;
    }

    .description {
      margin: 12px 0 27px;
      color: var(--subtext);
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 900;
    }

    .field input {
      width: 100%;
      height: 56px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fff;
      color: var(--text);
      font-size: 17px;
      outline: none;
      transition: 0.2s;
    }

    .field input:focus {
      border-color: var(--main);
      box-shadow:
        0 0 0 4px rgba(239, 63, 127, 0.12);
    }

    .lookup-button {
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          var(--main),
          var(--main-dark)
        );
      box-shadow:
        0 9px 20px rgba(239, 63, 127, 0.26);
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .lookup-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.55;
    }

    .message.error {
      display: block;
      color: #bd294d;
      background: #fff0f2;
    }

    .message.success {
      display: block;
      color: #176a3e;
      background: #eaf8ef;
    }

    .results {
      margin-top: 24px;
    }

    .order-card {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
    }

    .order-head {
      padding: 17px;
      border-radius: 15px;
      background: var(--main-light);
    }

    .customer-name {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 900;
    }

    .order-number {
      margin: 0;
      color: var(--subtext);
      font-size: 13px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
    }

    .badge.order {
      color: var(--warning);
      background: #fff2d7;
    }

    .badge.payment {
      color: var(--success);
      background: #e7f7ed;
    }

    .section-title {
      margin: 24px 0 11px;
      font-size: 16px;
      font-weight: 900;
    }

    .product-list,
    .information {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: #fff;
    }

    .product-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 16px;
      border-bottom: 1px solid #eee;
    }

    .product-row:last-child,
    .information-row:last-child {
      border-bottom: 0;
    }

    .product-name {
      margin: 0 0 5px;
      font-size: 15px;
      font-weight: 900;
    }

    .product-option {
      margin: 0;
      color: var(--subtext);
      font-size: 13px;
      line-height: 1.6;
    }

    .pickup-date {
      display: inline-block;
      margin-top: 7px;
      padding: 5px 8px;
      border-radius: 8px;
      color: var(--main-dark);
      background: var(--main-light);
      font-size: 12px;
      font-weight: 900;
    }

    .product-price {
      flex-shrink: 0;
      text-align: right;
      font-size: 14px;
      font-weight: 900;
    }

    .total-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 17px;
      border-radius: 14px;
      color: #fff;
      background: #292929;
    }

    .total-price {
      color: #ff8eb5;
      font-size: 21px;
      font-weight: 900;
    }

    .information-row {
      display: flex;
      padding: 14px 15px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      line-height: 1.5;
    }

    .information-label {
      width: 95px;
      flex-shrink: 0;
      color: var(--subtext);
    }

    .information-value {
      flex: 1;
      font-weight: 800;
    }

    .notice-box {
      padding: 16px;
      border-radius: 14px;
      color: #634d00;
      background: #fff8dd;
      font-size: 14px;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .privacy-note {
      margin: 21px 0 0;
      color: #9a9a9a;
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
    }

    .admin-link {
      display: block;
      margin-top: 26px;
      color: #aaa;
      text-align: center;
      text-decoration: none;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .page {
        padding-right: 14px;
        padding-left: 14px;
      }

      .card {
        padding-right: 18px;
        padding-left: 18px;
      }

      .brand-title {
        font-size: 33px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="brand">
      <h1 class="brand-title">
        DAMPICK
        <span>담픽</span>
      </h1>

      <p class="brand-slogan">
        모일수록 더 좋아진다,<br>
        담픽 공동구매
      </p>
    </header>

    <section class="card">
      <h2 class="card-title">
        내 주문 조회
      </h2>

      <p class="description">
        닉네임을 입력하면 주문 상품과 상품별 픽업 날짜를
        바로 확인할 수 있습니다.
      </p>

      <div class="field">
        <label for="nickname">
          닉네임
        </label>

        <input
          id="nickname"
          type="text"
          placeholder="예: 담픽1234"
          autocomplete="off"
        >
      </div>

      <button
        id="lookupButton"
        class="lookup-button"
        type="button"
      >
        주문 조회하기
      </button>

      <div
        id="message"
        class="message"
      ></div>

      <section
        id="results"
        class="results"
      ></section>

      <p class="privacy-note">
        닉네임만으로 조회하며 전화번호와 주소 같은
        민감한 개인정보는 표시하지 않습니다.
      </p>
    </section>

    <a
      class="admin-link"
      href="./admin.html"
    >
      관리자 페이지
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <script>
    const sb =
      window.dampickSupabase;

    const nicknameInput =
      document.getElementById("nickname");

    const lookupButton =
      document.getElementById("lookupButton");

    const message =
      document.getElementById("message");

    const results =
      document.getElementById("results");

    lookupButton.addEventListener(
      "click",
      lookupOrder
    );

    nicknameInput.addEventListener(
      "keydown",
      function (event) {
        if (event.key === "Enter") {
          lookupOrder();
        }
      }
    );

    async function lookupOrder() {
      const nickname =
        nicknameInput.value.trim();

      clearMessage();
      results.innerHTML = "";

      if (!nickname) {
        showMessage(
          "닉네임을 입력해주세요.",
          "error"
        );

        nicknameInput.focus();
        return;
      }

      if (!sb) {
        showMessage(
          "담픽 데이터베이스 연결정보를 불러오지 못했습니다.",
          "error"
        );

        return;
      }

      lookupButton.disabled = true;
      lookupButton.textContent =
        "주문을 확인하고 있습니다...";

      try {
        const { data, error } =
          await sb.rpc(
            "lookup_orders_by_nickname",
            {
              p_nickname: nickname
            }
          );

        if (error) {
          throw error;
        }

        const orderRows =
          normalizeOrders(data);

        if (!orderRows.length) {
          showMessage(
            "해당 닉네임으로 등록된 주문이 없습니다. 닉네임을 정확히 확인해주세요.",
            "error"
          );

          return;
        }

        showMessage(
          nickname +
          " 고객님의 주문 " +
          orderRows.length +
          "건을 찾았습니다.",
          "success"
        );

        renderOrders(orderRows);

      } catch (error) {
        console.error(error);

        showMessage(
          "주문정보를 불러오지 못했습니다. 관리자에게 문의해주세요.",
          "error"
        );

      } finally {
        lookupButton.disabled = false;
        lookupButton.textContent =
          "주문 조회하기";
      }
    }

    function normalizeOrders(data) {
      if (Array.isArray(data)) {
        return data;
      }

      if (typeof data === "string") {
        try {
          const parsed =
            JSON.parse(data);

          return Array.isArray(parsed)
            ? parsed
            : [];
        } catch (error) {
          return [];
        }
      }

      return [];
    }

    function renderOrders(orderRows) {
      results.innerHTML =
        orderRows
          .map(renderOrder)
          .join("");

      window.setTimeout(
        function () {
          results.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        },
        100
      );
    }

    function renderOrder(order) {
      const items =
        Array.isArray(order.items)
          ? order.items
          : [];

      const totalAmount =
        items.reduce(
          function (sum, item) {
            return (
              sum +
              Number(item.line_total || 0)
            );
          },
          0
        );

      const itemHtml =
        items.map(
          function (item) {
            return `
              <div class="product-row">
                <div>
                  <p class="product-name">
                    ${escapeHtml(item.product_name)}
                  </p>

                  <p class="product-option">
                    수량
                    ${escapeHtml(String(item.quantity))}
                    ${escapeHtml(item.unit_name || "개")}
                    · 개당
                    ${formatPrice(item.unit_price)}
                  </p>

                  <span class="pickup-date">
                    픽업 날짜:
                    ${formatDate(item.pickup_date)}
                  </span>
                </div>

                <div class="product-price">
                  ${formatPrice(item.line_total)}
                </div>
              </div>
            `;
          }
        ).join("");

      return `
        <article class="order-card">
          <div class="order-head">
            <p class="customer-name">
              ${escapeHtml(
                order.nickname ||
                "고객"
              )}
              고객님의 주문
            </p>

            <p class="order-number">
              주문번호:
              ${escapeHtml(order.order_number)}
            </p>

            <div class="badges">
              <span class="badge order">
                ${escapeHtml(order.order_status)}
              </span>

              <span class="badge payment">
                ${escapeHtml(order.payment_status)}
              </span>
            </div>
          </div>

          <h3 class="section-title">
            주문 상품
          </h3>

          <div class="product-list">
            ${itemHtml}
          </div>

          <div class="total-box">
            <span>총 주문금액</span>

            <strong class="total-price">
              ${formatPrice(totalAmount)}
            </strong>
          </div>

          <h3 class="section-title">
            주문정보
          </h3>

          <div class="information">
            <div class="information-row">
              <span class="information-label">
                주문일
              </span>

              <span class="information-value">
                ${formatDate(order.order_date)}
              </span>
            </div>
          </div>

          ${
            order.notice
              ? `
                <h3 class="section-title">
                  담픽 안내
                </h3>

                <div class="notice-box">
                  ${escapeHtml(order.notice)}
                </div>
              `
              : ""
          }
        </article>
      `;
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className =
        "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function formatPrice(value) {
      return (
        Number(value || 0)
          .toLocaleString("ko-KR") +
        "원"
      );
    }

    function formatDate(value) {
      if (!value) {
        return "미정";
      }

      const parts =
        String(value)
          .slice(0, 10)
          .split("-");

      if (parts.length !== 3) {
        return escapeHtml(value);
      }

      return (
        Number(parts[0]) +
        "년 " +
        Number(parts[1]) +
        "월 " +
        Number(parts[2]) +
        "일"
      );
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
