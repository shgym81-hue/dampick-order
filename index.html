<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="담픽 고객 주문조회">
  <title>담픽 주문조회</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --main: #ef4f87;
      --main-dark: #d63d72;
      --main-light: #fff0f5;
      --text: #242424;
      --sub: #777777;
      --border: #e9e9e9;
      --success: #167647;
      --warning: #c97800;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: var(--text);
      background: linear-gradient(
        180deg,
        #fff0f5 0%,
        #fff9fb 55%,
        #ffffff 100%
      );
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 34px 18px 50px;
    }

    .brand {
      margin-bottom: 25px;
      text-align: center;
    }

    .brand h1 {
      margin: 0;
      color: var(--main);
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .brand h1 span {
      margin-left: 5px;
      color: var(--main-dark);
      font-size: 19px;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--sub);
      font-size: 14px;
    }

    .card {
      padding: 28px 22px;
      border: 1px solid rgba(239, 79, 135, 0.12);
      border-radius: 23px;
      background: #ffffff;
      box-shadow: 0 14px 38px rgba(129, 61, 85, 0.12);
    }

    .card h2 {
      margin: 0;
      text-align: center;
      font-size: 25px;
      font-weight: 900;
    }

    .description {
      margin: 11px 0 26px;
      color: var(--sub);
      text-align: center;
      font-size: 14px;
      line-height: 1.65;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
    }

    input {
      width: 100%;
      height: 55px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 13px;
      outline: none;
      font-size: 17px;
    }

    input:focus {
      border-color: var(--main);
      box-shadow: 0 0 0 4px rgba(239, 79, 135, 0.12);
    }

    .lookup-button {
      width: 100%;
      height: 56px;
      margin-top: 18px;
      border: 0;
      border-radius: 14px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--main), var(--main-dark));
      box-shadow: 0 9px 20px rgba(239, 79, 135, 0.25);
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .lookup-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      font-size: 14px;
      line-height: 1.55;
    }

    .message.error {
      display: block;
      color: #bd294d;
      background: #fff0f2;
    }

    .message.info {
      display: block;
      color: #245f8f;
      background: #edf7ff;
    }

    .results {
      margin-top: 24px;
    }

    .order-card {
      margin-top: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #ffffff;
    }

    .order-head {
      padding: 16px;
      border-radius: 14px;
      background: var(--main-light);
    }

    .customer-name {
      margin: 0 0 6px;
      font-size: 18px;
      font-weight: 900;
    }

    .order-number {
      margin: 0;
      color: var(--sub);
      font-size: 13px;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .badge.order {
      color: var(--warning);
      background: #fff1d4;
    }

    .badge.payment {
      color: var(--success);
      background: #e8f7ee;
    }

    .section-title {
      margin: 22px 0 10px;
      font-size: 16px;
      font-weight: 900;
    }

    .product-list,
    .info-list {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .product-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 15px;
      border-bottom: 1px solid #eeeeee;
    }

    .product-row:last-child,
    .info-row:last-child {
      border-bottom: 0;
    }

    .product-name {
      margin: 0 0 5px;
      font-weight: 800;
    }

    .product-meta {
      margin: 0;
      color: var(--sub);
      font-size: 13px;
    }

    .product-price {
      flex-shrink: 0;
      font-weight: 800;
    }

    .total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 11px;
      padding: 16px;
      border-radius: 14px;
      color: #ffffff;
      background: #292929;
    }

    .total strong {
      color: #ff8eb5;
      font-size: 21px;
    }

    .info-row {
      display: flex;
      padding: 14px 15px;
      border-bottom: 1px solid #eeeeee;
      font-size: 14px;
      line-height: 1.5;
    }

    .info-label {
      width: 95px;
      flex-shrink: 0;
      color: var(--sub);
    }

    .info-value {
      flex: 1;
      font-weight: 700;
    }

    .notice {
      padding: 15px;
      border-radius: 14px;
      color: #665000;
      background: #fff8dc;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .privacy-note {
      margin-top: 18px;
      color: #999999;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    .admin-link {
      display: block;
      margin-top: 24px;
      color: #aaaaaa;
      text-align: center;
      text-decoration: none;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .page {
        padding-right: 14px;
        padding-left: 14px;
      }

      .card {
        padding-right: 18px;
        padding-left: 18px;
      }

      .brand h1 {
        font-size: 33px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="brand">
      <h1>DAMPICK <span>담픽</span></h1>
      <p>이걸 함께 담다, 담픽.</p>
    </header>

    <section class="card">
      <h2>내 주문 조회</h2>

      <p class="description">
        주문할 때 사용한 고객 이름을 입력하면<br>
        등록된 주문상품을 확인할 수 있습니다.
      </p>

      <label for="customerName">고객 이름</label>

      <input
        id="customerName"
        type="text"
        placeholder="예: 김승현"
        autocomplete="name"
      >

      <button
        id="lookupButton"
        class="lookup-button"
        type="button"
      >
        주문 조회하기
      </button>

      <div id="message" class="message"></div>
      <div id="results" class="results"></div>

      <p class="privacy-note">
        이름만으로 조회하는 방식이므로 전화번호, 주소 등 민감한 개인정보는 표시하지 않습니다.
      </p>
    </section>

    <a class="admin-link" href="./admin.html">
      관리자 페이지
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /*
      아래 두 줄을 Supabase 프로젝트의 실제 정보로 바꾸세요.

      Supabase에서 확인하는 위치:
      Project Settings → API

      주의:
      service_role 키는 절대로 넣지 마세요.
      anon key 또는 publishable key만 넣으세요.
    */

    const SUPABASE_URL =
      "여기에_SUPABASE_PROJECT_URL_입력";

    const SUPABASE_ANON_KEY =
      "여기에_SUPABASE_ANON_KEY_입력";

    const sb = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const nameInput =
      document.getElementById("customerName");

    const lookupButton =
      document.getElementById("lookupButton");

    const message =
      document.getElementById("message");

    const results =
      document.getElementById("results");

    lookupButton.addEventListener(
      "click",
      lookupOrders
    );

    nameInput.addEventListener(
      "keydown",
      function (event) {
        if (event.key === "Enter") {
          lookupOrders();
        }
      }
    );

    async function lookupOrders() {
      const customerName =
        nameInput.value.trim();

      message.className = "message";
      message.textContent = "";
      results.innerHTML = "";

      if (!customerName) {
        showMessage(
          "고객 이름을 입력해주세요.",
          "error"
        );

        nameInput.focus();
        return;
      }

      if (
        SUPABASE_URL.includes("여기에_") ||
        SUPABASE_ANON_KEY.includes("여기에_")
      ) {
        showMessage(
          "아직 Supabase 연결정보가 입력되지 않았습니다.",
          "error"
        );

        return;
      }

      lookupButton.disabled = true;
      lookupButton.textContent =
        "주문을 확인하고 있습니다...";

      try {
        const { data, error } =
          await sb.rpc(
            "lookup_orders_by_name",
            {
              p_customer_name: customerName
            }
          );

        if (error) {
          throw error;
        }

        const orders =
          Array.isArray(data) ? data : [];

        if (orders.length === 0) {
          showMessage(
            "해당 이름으로 등록된 주문이 없습니다. 주문할 때 사용한 이름을 정확히 입력해주세요.",
            "error"
          );

          return;
        }

        showMessage(
          customerName +
          " 고객님의 주문 " +
          orders.length +
          "건을 찾았습니다.",
          "info"
        );

        results.innerHTML =
          orders.map(renderOrder).join("");

      } catch (error) {
        console.error(error);

        showMessage(
          "주문을 불러오지 못했습니다. Supabase 연결정보와 데이터베이스 설정을 확인해주세요.",
          "error"
        );

      } finally {
        lookupButton.disabled = false;
        lookupButton.textContent =
          "주문 조회하기";
      }
    }

    function renderOrder(order) {
      const items =
        Array.isArray(order.items)
          ? order.items
          : [];

      const totalAmount =
        items.reduce(
          function (sum, item) {
            return (
              sum +
              Number(item.line_total || 0)
            );
          },
          0
        );

      const itemHtml =
        items.map(
          function (item) {
            return `
              <div class="product-row">
                <div>
                  <p class="product-name">
                    ${escapeHtml(item.product_name)}
                  </p>

                  <p class="product-meta">
                    ${escapeHtml(String(item.quantity))}
                    ${escapeHtml(item.unit_name || "개")}
                    · 개당 ${formatPrice(item.unit_price)}
                  </p>
                </div>

                <div class="product-price">
                  ${formatPrice(item.line_total)}
                </div>
              </div>
            `;
          }
        ).join("");

      return `
        <article class="order-card">

          <div class="order-head">

            <p class="customer-name">
              ${escapeHtml(order.customer_name)}
              고객님의 주문
            </p>

            <p class="order-number">
              주문번호:
              ${escapeHtml(order.order_number)}
            </p>

            <div class="badges">

              <span class="badge order">
                ${escapeHtml(order.order_status)}
              </span>

              <span class="badge payment">
                ${escapeHtml(order.payment_status)}
              </span>

            </div>

          </div>

          <h3 class="section-title">
            주문 상품
          </h3>

          <div class="product-list">
            ${itemHtml}
          </div>

          <div class="total">
            <span>총 주문금액</span>
            <strong>${formatPrice(totalAmount)}</strong>
          </div>

          <h3 class="section-title">
            픽업정보
          </h3>

          <div class="info-list">

            <div class="info-row">
              <span class="info-label">
                주문일
              </span>

              <span class="info-value">
                ${formatDate(order.order_date)}
              </span>
            </div>

            <div class="info-row">
              <span class="info-label">
                픽업 예정일
              </span>

              <span class="info-value">
                ${formatDate(order.pickup_date)}
              </span>
            </div>

            <div class="info-row">
              <span class="info-label">
                픽업 장소
              </span>

              <span class="info-value">
                ${escapeHtml(
                  order.pickup_place ||
                  "별도 안내"
                )}
              </span>
            </div>

          </div>

          ${
            order.notice
              ? `
                <h3 class="section-title">
                  담픽 안내
                </h3>

                <div class="notice">
                  ${escapeHtml(order.notice)}
                </div>
              `
              : ""
          }

        </article>
      `;
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className =
        "message " + type;
    }

    function formatPrice(value) {
      return (
        Number(value || 0)
          .toLocaleString("ko-KR") +
        "원"
      );
    }

    function formatDate(value) {
      if (!value) {
        return "미정";
      }

      const parts =
        String(value).split("-");

      return (
        parts[0] +
        "년 " +
        Number(parts[1]) +
        "월 " +
        Number(parts[2]) +
        "일"
      );
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
