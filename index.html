<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="담픽 공동구매 주문조회"
  >

  <meta name="theme-color" content="#ee2f78">

  <title>담픽 공동구매 주문조회</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --main: #f2387d;
      --main-dark: #d91d68;
      --main-deep: #bd1457;
      --main-soft: #fff0f6;
      --main-pale: #fff7fa;
      --navy: #141b3d;
      --text: #252533;
      --subtext: #71717d;
      --border: #f0dce5;
      --success: #26744b;
      --success-bg: #eef9f2;
      --warning: #a76b00;
      --shadow: 0 20px 55px rgba(186, 39, 96, 0.14);
    }

    html {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      overflow-x: clip;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      scroll-behavior: smooth;
      background: #fff8fb;
    }

    body {
      position: relative;
      width: 100%;
      max-width: 100%;
      min-height: 100svh;
      margin: 0;
      overflow-x: clip;
      overscroll-behavior-x: none;
      overscroll-behavior-y: none;
      touch-action: pan-y;
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255, 144, 187, 0.20) 0,
          rgba(255, 144, 187, 0) 25%
        ),
        radial-gradient(
          circle at 92% 16%,
          rgba(244, 47, 123, 0.17) 0,
          rgba(244, 47, 123, 0) 23%
        ),
        linear-gradient(
          180deg,
          #fff4f8 0%,
          #fffafc 48%,
          #ffffff 100%
        );
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      content: "";
      pointer-events: none;
      filter: blur(0.2px);
    }

    body::before {
      top: 118px;
      right: -22px;
      width: 148px;
      height: 170px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 30% 25%,
          #ffb7d1 0%,
          #f83f85 48%,
          #d81360 100%
        );
      box-shadow:
        inset 16px 18px 28px rgba(255, 255, 255, 0.30),
        0 24px 48px rgba(218, 28, 99, 0.15);
      opacity: 0.72;
    }

    body::after {
      top: 190px;
      left: 7%;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 30% 25%,
          #ffd1e0 0%,
          #f94586 55%,
          #cc0f57 100%
        );
      box-shadow:
        inset 4px 4px 8px rgba(255, 255, 255, 0.45),
        0 9px 18px rgba(209, 23, 89, 0.20);
      opacity: 0.8;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .top-accent {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      width: 100%;
      max-width: 100vw;
      z-index: 50;
      height: max(7px, env(safe-area-inset-top));
      background:
        linear-gradient(
          90deg,
          #ff4b8f,
          #e92170,
          #d81360
        );
      box-shadow: 0 2px 10px rgba(217, 29, 104, 0.12);
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 560px;
      min-height: 100svh;
      margin: 0 auto;
      overflow-x: clip;
      padding:
        calc(42px + env(safe-area-inset-top))
        18px
        calc(16px + env(safe-area-inset-bottom));
    }

    .page::before {
      position: absolute;
      top: 260px;
      left: 50%;
      z-index: -1;
      width: min(720px, 145vw);
      height: 250px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transform: translateX(-50%) rotate(-8deg);
      content: "";
      pointer-events: none;
    }

    .brand {
      position: relative;
      z-index: 3;
      margin-bottom: 62px;
      text-align: center;
    }

    .brand-bag {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      margin: 0 auto 6px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 16px;
      color: #fff;
      background:
        linear-gradient(
          145deg,
          #ff6da4,
          #ed2d79 55%,
          #c9165e
        );
      box-shadow:
        inset 0 5px 10px rgba(255, 255, 255, 0.30),
        0 12px 25px rgba(226, 31, 107, 0.22);
      transform: rotate(-3deg);
    }

    .brand-bag svg {
      width: 26px;
      height: 26px;
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 10px;
      margin: 0;
      color: var(--main-dark);
      font-size: clamp(42px, 11vw, 57px);
      font-weight: 950;
      letter-spacing: -2.5px;
      line-height: 1;
      text-shadow: 0 8px 24px rgba(232, 36, 113, 0.10);
    }

    .brand-title span {
      color: var(--main-deep);
      font-size: clamp(19px, 5vw, 25px);
      font-weight: 950;
      letter-spacing: -1px;
    }

    .brand-slogan {
      position: relative;
      z-index: 4;
      margin: 20px 0 0;
      color: #686875;
      font-size: 16px;
      font-weight: 750;
      line-height: 1.55;
      letter-spacing: -0.35px;
    }

    .brand-slogan strong {
      color: var(--main);
      font-weight: 950;
    }

    .lookup-card {
      position: relative;
      isolation: isolate;
      padding: 76px 28px 28px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .lookup-card::before {
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.78),
          rgba(255, 255, 255, 0) 45%
        );
      content: "";
      pointer-events: none;
    }

    .lookup-card > * {
      position: relative;
      z-index: 1;
    }

    .card-icon {
      position: absolute;
      top: -39px;
      left: 50%;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 82px;
      height: 82px;
      border: 8px solid rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      color: var(--main);
      background:
        linear-gradient(
          145deg,
          #fff5f9,
          #ffe2ed
        );
      box-shadow:
        0 16px 30px rgba(215, 36, 104, 0.15),
        inset 0 3px 7px rgba(255, 255, 255, 0.85);
      transform: translateX(-50%);
    }

    .card-icon svg {
      width: 38px;
      height: 38px;
    }

    .card-title {
      margin: 0;
      color: var(--navy);
      text-align: center;
      font-size: clamp(31px, 8vw, 39px);
      font-weight: 950;
      letter-spacing: -1.7px;
      line-height: 1.2;
    }

    .title-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      margin: 16px auto 18px;
      color: var(--main);
    }

    .title-divider::before,
    .title-divider::after {
      width: 55px;
      height: 2px;
      border-radius: 999px;
      background:
        linear-gradient(
          90deg,
          transparent,
          #ff6a9f
        );
      content: "";
    }

    .title-divider::after {
      background:
        linear-gradient(
          90deg,
          #ff6a9f,
          transparent
        );
    }

    .title-divider svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .description {
      max-width: 430px;
      margin: 0 auto 30px;
      color: #595966;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.75;
      letter-spacing: -0.3px;
      word-break: keep-all;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin: 0 0 10px 2px;
      color: var(--navy);
      font-size: 15px;
      font-weight: 950;
      letter-spacing: -0.3px;
    }

    .input-shell {
      position: relative;
      display: flex;
      align-items: center;
      min-height: 64px;
      overflow: hidden;
      border: 1.5px solid #f4bfd3;
      border-radius: 18px;
      background: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 8px 20px rgba(199, 30, 94, 0.04);
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .input-shell:focus-within {
      border-color: var(--main);
      box-shadow:
        0 0 0 5px rgba(242, 56, 125, 0.10),
        0 13px 28px rgba(199, 30, 94, 0.08);
      transform: translateY(-1px);
    }

    .input-icon {
      display: flex;
      flex: 0 0 58px;
      align-items: center;
      justify-content: center;
      color: #f56a9c;
    }

    .input-icon svg {
      width: 25px;
      height: 25px;
    }

    .field input {
      width: 100%;
      height: 64px;
      padding: 0 17px 0 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      outline: none;
    }

    .field input::placeholder {
      color: #a6a4ab;
      font-weight: 500;
    }

    .lookup-button {
      position: relative;
      width: 100%;
      min-height: 66px;
      overflow: hidden;
      border: 0;
      border-radius: 18px;
      color: #fff;
      background:
        linear-gradient(
          105deg,
          #fa397e 0%,
          #eb2472 52%,
          #d91767 100%
        );
      box-shadow:
        0 16px 27px rgba(226, 29, 105, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      font-size: 20px;
      font-weight: 950;
      letter-spacing: -0.5px;
      cursor: pointer;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        opacity 0.18s ease;
    }

    .lookup-button::before {
      position: absolute;
      top: -130%;
      left: -20%;
      width: 32%;
      height: 350%;
      background: rgba(255, 255, 255, 0.16);
      transform: rotate(28deg);
      content: "";
      transition: left 0.5s ease;
    }

    .lookup-button::after {
      position: absolute;
      top: 50%;
      right: 22px;
      width: 28px;
      height: 28px;
      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      background:
        linear-gradient(
          135deg,
          transparent 44%,
          #fff 45% 55%,
          transparent 56%
        );
      background-size: 8px 8px;
      background-position: 8px center;
      background-repeat: no-repeat;
      content: "";
      transform: translateY(-50%);
    }

    .lookup-button:hover::before {
      left: 108%;
    }

    .lookup-button:active {
      transform: translateY(2px) scale(0.995);
      box-shadow:
        0 9px 18px rgba(226, 29, 105, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .lookup-button:disabled {
      opacity: 0.68;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 15px 16px;
      border: 1px solid transparent;
      border-radius: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: 750;
      line-height: 1.55;
      word-break: keep-all;
    }

    .message.error {
      display: block;
      color: #b32954;
      border-color: #ffd0df;
      background: #fff0f5;
    }

    .privacy-note {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      margin: 24px 0 0;
      padding: 15px 16px;
      border: 1px solid #f5dce6;
      border-radius: 16px;
      color: #74727b;
      background:
        linear-gradient(
          135deg,
          #fffafa,
          #fff4f8
        );
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.65;
      word-break: keep-all;
    }

    .privacy-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: var(--main);
      background: #ffe4ee;
    }

    .privacy-icon svg {
      width: 22px;
      height: 22px;
    }

    .results {
      margin-top: 26px;
      scroll-margin-top: 16px;
    }

    .order-card {
      margin-top: 18px;
      padding: 17px;
      border: 1px solid #f0dce5;
      border-radius: 22px;
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #fffafd 100%
        );
      box-shadow: 0 13px 30px rgba(133, 35, 75, 0.08);
    }

    .order-head {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border: 1px solid rgba(246, 188, 212, 0.55);
      border-radius: 17px;
      background:
        linear-gradient(
          135deg,
          #fff2f7,
          #fff8fb 60%,
          #ffeaf2
        );
    }

    .order-head::after {
      position: absolute;
      top: -35px;
      right: -24px;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      background: rgba(244, 65, 132, 0.08);
      content: "";
    }

    .customer-name {
      position: relative;
      z-index: 1;
      margin: 0 0 7px;
      color: var(--navy);
      font-size: 19px;
      font-weight: 950;
      letter-spacing: -0.5px;
    }

    .order-number {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #85838b;
      font-size: 12.5px;
      font-weight: 650;
      word-break: break-all;
    }

    .badges {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .badge {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 900;
    }

    .badge.order {
      color: var(--warning);
      background: #fff1ce;
    }

    .badge.payment {
      color: var(--success);
      background: #e6f7ec;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 23px 2px 11px;
      color: var(--navy);
      font-size: 16px;
      font-weight: 950;
      letter-spacing: -0.3px;
    }

    .section-title::before {
      width: 5px;
      height: 17px;
      border-radius: 999px;
      background:
        linear-gradient(
          180deg,
          #ff699e,
          #d91767
        );
      content: "";
    }

    .product-list {
      overflow: hidden;
      border: 1px solid #f0e2e8;
      border-radius: 16px;
      background: #fff;
    }

    .product-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      padding: 16px;
      border-bottom: 1px solid #f1e8ec;
    }

    .product-row:last-child {
      border-bottom: 0;
    }

    .product-name {
      margin: 0 0 6px;
      color: #272733;
      font-size: 15px;
      font-weight: 950;
      line-height: 1.45;
      word-break: keep-all;
    }

    .product-option {
      margin: 0;
      color: #797780;
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.65;
    }

    .pickup-date {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 9px;
      border: 1px solid #ffd4e3;
      border-radius: 9px;
      color: var(--main-dark);
      background: var(--main-soft);
      font-size: 11.5px;
      font-weight: 900;
      line-height: 1.4;
    }

    .product-price {
      align-self: start;
      min-width: 72px;
      padding-top: 1px;
      color: var(--main-deep);
      text-align: right;
      font-size: 14px;
      font-weight: 950;
      white-space: nowrap;
    }

    .notice-box {
      padding: 15px 16px;
      border: 1px solid #f5e3b2;
      border-radius: 15px;
      color: #63500f;
      background:
        linear-gradient(
          135deg,
          #fff9df,
          #fffdf1
        );
      font-size: 13px;
      font-weight: 600;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .admin-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 28px;
      padding: 9px 13px;
      color: #87858e;
      text-align: center;
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 700;
      transition:
        color 0.2s ease,
        transform 0.2s ease;
    }

    .admin-link:hover {
      color: var(--main-dark);
      transform: translateY(-1px);
    }

    .admin-link svg {
      width: 16px;
      height: 16px;
    }

    .admin-link-wrap {
      text-align: center;
    }

    .bottom-wave {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: -1;
      width: 100%;
      height: 105px;
      border-radius: 55% 55% 0 0;
      background:
        linear-gradient(
          120deg,
          rgba(255, 195, 218, 0.42),
          rgba(239, 56, 125, 0.18),
          rgba(255, 232, 241, 0.65)
        );
      transform: none;
      pointer-events: none;
    }

    @supports not (overflow: clip) {
      html,
      body,
      .page {
        overflow-x: hidden;
      }
    }

    @media (min-width: 720px) {
      .page {
        max-width: 660px;
        padding-right: 32px;
        padding-left: 32px;
      }

      .lookup-card {
        padding-right: 38px;
        padding-left: 38px;
      }
    }

    @media (max-width: 420px) {
      body::before {
        right: -28px;
        width: 132px;
        height: 132px;
      }

      .page {
        padding-right: 16px;
        padding-left: 16px;
      }

      .brand {
        margin-bottom: 58px;
      }

      .brand-bag {
        width: 43px;
        height: 43px;
        border-radius: 14px;
      }

      .brand-title {
        gap: 7px;
        font-size: 42px;
      }

      .brand-title span {
        font-size: 20px;
      }

      .brand-slogan {
        margin-top: 16px;
        font-size: 14px;
      }

      .lookup-card {
        padding: 69px 20px 23px;
        border-radius: 29px;
      }

      .card-icon {
        top: -35px;
        width: 72px;
        height: 72px;
        border-width: 7px;
      }

      .card-icon svg {
        width: 33px;
        height: 33px;
      }

      .card-title {
        font-size: 32px;
      }

      .description {
        margin-bottom: 25px;
        font-size: 14px;
        line-height: 1.7;
      }

      .input-shell,
      .field input {
        min-height: 60px;
        height: 60px;
      }

      .lookup-button {
        min-height: 62px;
        padding-right: 50px;
        padding-left: 50px;
        font-size: 18px;
      }

      .lookup-button::after {
        right: 18px;
        width: 26px;
        height: 26px;
      }

      .privacy-note {
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 10px;
        padding: 14px;
        font-size: 11.5px;
      }

      .privacy-icon {
        width: 38px;
        height: 38px;
      }

      .order-card {
        padding: 14px;
        border-radius: 19px;
      }

      .product-row {
        padding: 14px;
      }
    }

    @media (max-width: 350px) {
      .brand-title {
        font-size: 37px;
      }

      .brand-title span {
        font-size: 18px;
      }

      .lookup-card {
        padding-right: 17px;
        padding-left: 17px;
      }

      .lookup-button {
        padding-right: 42px;
        padding-left: 22px;
        font-size: 17px;
      }

      .product-row {
        grid-template-columns: 1fr;
      }

      .product-price {
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <div class="top-accent"></div>

  <main class="page">
    <header class="brand">
      <div class="brand-bag" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M6.5 8.5H17.5L18.4 20H5.6L6.5 8.5Z"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linejoin="round"
          />
          <path
            d="M9 9V6.7C9 5.2 10.3 4 12 4C13.7 4 15 5.2 15 6.7V9"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />

  <script>
    if ("scrollRestoration" in history) {
      history.scrollRestoration = "manual";
    }

    window.addEventListener("pageshow", function () {
      if (!window.location.hash) {
        window.scrollTo(0, 0);

    });

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <script>
    const sb =
      window.dampickSupabase;

    const nicknameInput =
      document.getElementById("nickname");

    const lookupButton =
      document.getElementById("lookupButton");

    const message =
      document.getElementById("message");

    const results =
      document.getElementById("results");

    lookupButton.addEventListener(
      "click",
      lookupOrder
    );

    nicknameInput.addEventListener(
      "keydown",
      function (event) {
        if (event.key === "Enter") {
          lookupOrder();
        }
      }
    );

    async function lookupOrder() {
      const nickname =
        nicknameInput.value.trim();

      clearMessage();
      results.innerHTML = "";

      if (!nickname) {
        showMessage(
          "닉네임을 입력해주세요.",
          "error"
        );

        nicknameInput.focus();
        return;
      }

      if (!sb) {
        showMessage(
          "담픽 데이터베이스 연결정보를 불러오지 못했습니다.",
          "error"
        );

        return;
      }

      lookupButton.disabled = true;
      lookupButton.textContent =
        "주문을 확인하고 있습니다...";

      try {
        const { data, error } =
          await sb.rpc(
            "lookup_orders_by_nickname",
            {
              p_nickname: nickname
            }
          );

        if (error) {
          throw error;
        }

        const orderRows =
          normalizeOrders(data);

        if (!orderRows.length) {
          showMessage(
            "해당 닉네임으로 등록된 주문이 없습니다. 닉네임을 정확히 확인해주세요.",
            "error"
          );

          return;
        }

        renderOrders(orderRows);

      } catch (error) {
        console.error(error);

        showMessage(
          "주문정보를 불러오지 못했습니다. 관리자에게 문의해주세요.",
          "error"
        );

      } finally {
        lookupButton.disabled = false;
        lookupButton.textContent =
          "주문 조회하기";
      }
    }

    function normalizeOrders(data) {
      if (Array.isArray(data)) {
        return data;
      }

      if (typeof data === "string") {
        try {
          const parsed =
            JSON.parse(data);

          return Array.isArray(parsed)
            ? parsed
            : [];
        } catch (error) {
          return [];
        }
      }

      return [];
    }

    function getPickupDateSortValue(value) {
      if (!value) {
        return Number.POSITIVE_INFINITY;
      }

      const normalizedValue =
        String(value).slice(0, 10);

      const date =
        new Date(normalizedValue + "T00:00:00");

      if (Number.isNaN(date.getTime())) {
        return Number.POSITIVE_INFINITY;
      }

      return date.getTime();
    }

    function getEarliestPickupDateValue(order) {
      const items =
        Array.isArray(order.items)
          ? order.items
          : [];

      if (!items.length) {
        return Number.POSITIVE_INFINITY;
      }

      return items.reduce(
        function (earliest, item) {
          return Math.min(
            earliest,
            getPickupDateSortValue(
              item.pickup_date
            )
          );
        },
        Number.POSITIVE_INFINITY
      );
    }

    function renderOrders(orderRows) {
      const sortedOrders =
        [...orderRows].sort(
          function (a, b) {
            const aDate =
              getEarliestPickupDateValue(a);

            const bDate =
              getEarliestPickupDateValue(b);

            if (aDate !== bDate) {
              return aDate - bDate;
            }

            return String(
              a.order_number || ""
            ).localeCompare(
              String(b.order_number || "")
            );
          }
        );

      results.innerHTML =
        sortedOrders
          .map(renderOrder)
          .join("");

      window.setTimeout(
        function () {
          results.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        },
        100
      );
    }

    function renderOrder(order) {
      const items =
        Array.isArray(order.items)
          ? [...order.items].sort(
              function (a, b) {
                const aDate =
                  getPickupDateSortValue(
                    a.pickup_date
                  );

                const bDate =
                  getPickupDateSortValue(
                    b.pickup_date
                  );

                if (aDate !== bDate) {
                  return aDate - bDate;
                }

                return String(
                  a.product_name || ""
                ).localeCompare(
                  String(
                    b.product_name || ""
                  ),
                  "ko-KR"
                );
              }
            )
          : [];

      const itemHtml =
        items.map(
          function (item) {
            return `
              <div class="product-row">
                <div>
                  <p class="product-name">
                    ${escapeHtml(item.product_name)}
                  </p>

                  <p class="product-option">
                    수량
                    ${escapeHtml(String(item.quantity))}
                    ${escapeHtml(item.unit_name || "개")}
                    · 개당
                    ${formatPrice(item.unit_price)}
                  </p>

                  <span class="pickup-date">
                    픽업 날짜:
                    ${formatDate(item.pickup_date)}
                  </span>
                </div>

                <div class="product-price">
                  ${formatPrice(item.line_total)}
                </div>
              </div>
            `;
          }
        ).join("");

      return `
        <article class="order-card">
          <div class="order-head">
            <p class="customer-name">
              ${escapeHtml(
                order.nickname ||
                "고객"
              )}
              고객님의 주문
            </p>

            <p class="order-number">
              주문번호:
              ${escapeHtml(order.order_number)}
            </p>

            <div class="badges">
              <span class="badge order">
                ${escapeHtml(order.order_status)}
              </span>

              <span class="badge payment">
                ${escapeHtml(order.payment_status)}
              </span>
            </div>
          </div>

          <h3 class="section-title">
            주문 상품
          </h3>

          <div class="product-list">
            ${itemHtml}
          </div>

          ${
            order.notice
              ? `
                <h3 class="section-title">
                  담픽 안내
                </h3>

                <div class="notice-box">
                  ${escapeHtml(order.notice)}
                </div>
              `
              : ""
          }
        </article>
      `;
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className =
        "message " + type;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function formatPrice(value) {
      return (
        Number(value || 0)
          .toLocaleString("ko-KR") +
        "원"
      );
    }

    function formatDate(value) {
      if (!value) {
        return "미정";
      }

      const parts =
        String(value)
          .slice(0, 10)
          .split("-");

      if (parts.length !== 3) {
        return escapeHtml(value);
      }

      return (
        Number(parts[0]) +
        "년 " +
        Number(parts[1]) +
        "월 " +
        Number(parts[2]) +
        "일"
      );
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>

            field.setAttribute(
              "autocapitalize",
              "off"
            );
            field.setAttribute(
              "spellcheck",
              "false"
            );
          }
        );
      }
    );
