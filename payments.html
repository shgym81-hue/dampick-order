<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>담픽 결제·배송 관리</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --main: #ef3f7f;
      --main-dark: #d92d69;
      --dark: #28252a;
      --sub: #777;
      --border: #e8e1e4;
      --bg: #fff7fa;
      --success: #197348;
      --danger: #c83b54;
    }

    body {
      margin: 0;
      color: var(--dark);
      background: var(--bg);
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .wrap {
      width:
        min(
          1050px,
          calc(100% - 28px)
        );
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    .card {
      margin-bottom: 17px;
      padding: 20px;
      border:
        1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      box-shadow:
        0 8px 24px rgba(0,0,0,.06);
    }

    .hidden {
      display: none !important;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    h1 {
      color: var(--main-dark);
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-weight: 900;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border:
        1px solid var(--border);
      border-radius: 10px;
    }

    .button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 9px 13px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: var(--main);
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }

    .button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .button.secondary {
      background: #333;
    }

    .button.success {
      background: var(--success);
    }

    .button.danger {
      background: var(--danger);
    }

    .button.light {
      color: #333;
      background: #ececec;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .topbar {
      display: flex;
      justify-content:
        space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .message {
      display: none;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #a62840;
      background: #fff0f3;
    }

    .message.success {
      color: #176a3e;
      background: #eaf8ef;
    }

    .tools {
      display: grid;
      grid-template-columns:
        1fr auto;
      gap: 10px;
      align-items: end;
    }

    .request-list {
      display: grid;
      gap: 13px;
    }

    .request-card {
      padding: 17px;
      border:
        1px solid var(--border);
      border-radius: 15px;
      background: #fff;
    }

    .request-card.home {
      border-color: #f0b4ca;
      background: #fffafd;
    }

    .request-head {
      display: flex;
      justify-content:
        space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .request-code {
      color: var(--main-dark);
      font-weight: 950;
    }

    .badge {
      display: inline-flex;
      margin: 4px 5px 0 0;
      padding: 5px 8px;
      border-radius: 999px;
      background: #f0f0f0;
      font-size: 11px;
      font-weight: 900;
    }

    .detail-grid {
      display: grid;
      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );
      gap: 9px;
      margin-top: 13px;
    }

    .detail-box {
      padding: 11px;
      border-radius: 11px;
      background: #fafafa;
      line-height: 1.6;
    }

    .detail-box strong {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
    }

    .amount {
      color: var(--main-dark);
      font-size: 20px;
      font-weight: 950;
    }

    .sensitive {
      border: 1px solid #f2cad8;
      background: #fff5f8;
    }

    .item-list {
      display: grid;
      gap: 8px;
      margin-top: 13px;
    }

    .item-row {
      display: flex;
      justify-content:
        space-between;
      gap: 12px;
      padding: 11px;
      border:
        1px solid #eee;
      border-radius: 11px;
      background: #fff;
    }

    .item-name {
      font-weight: 950;
    }

    .item-meta {
      margin-top: 5px;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.55;
    }

    .item-price {
      flex: 0 0 auto;
      color: var(--main-dark);
      font-weight: 950;
    }

    @media (max-width: 650px) {
      .topbar,
      .request-head,
      .item-row {
        flex-direction: column;
      }

      .tools,
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .item-price {
        text-align: right;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section
      id="loginCard"
      class="card"
    >
      <h1>담픽 결제·배송 관리</h1>

      <p>
        기존 담픽 관리자와 같은
        Supabase 관리자 계정으로 로그인하세요.
      </p>

      <label for="email">
        관리자 이메일
      </label>

      <input
        id="email"
        type="email"
        autocomplete="username"
      >

      <label for="password">
        관리자 비밀번호
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

      <div class="actions">
        <button
          id="loginButton"
          class="button"
          type="button"
        >
          관리자 로그인
        </button>

        <a
          class="button secondary"
          href="./admin.html"
        >
          기존 관리자 화면
        </a>
      </div>
    </section>

    <section
      id="app"
      class="hidden"
    >
      <div class="topbar">
        <div>
          <h1>담픽 결제·배송 관리</h1>

          <p>
            고객이 체크한 상품만 한 건의 결제·배송 신청으로 표시됩니다.
            일부 상품은 계좌이체, 나머지는 픽업결제로 나누어 관리할 수 있습니다.
          </p>
        </div>

        <div class="actions">
          <a
            class="button secondary"
            href="./admin.html"
          >
            기존 관리자
          </a>

          <a
            class="button light"
            href="./index.html"
          >
            고객 화면
          </a>

          <button
            id="logoutButton"
            class="button danger"
            type="button"
          >
            로그아웃
          </button>
        </div>
      </div>

      <div
        id="message"
        class="message"
      ></div>

      <section class="card">
        <div class="tools">
          <div>
            <label for="statusFilter">
              표시 조건
            </label>

            <select id="statusFilter">
              <option value="all">
                전체 신청
              </option>
              <option value="신청">
                새 신청
              </option>
              <option value="입금 확인 대기">
                입금 확인 대기
              </option>
              <option value="카드 결제 대기">
                카드 결제 대기
              </option>
              <option value="현장 결제 예정">
                현장 결제 예정
              </option>
              <option value="결제 완료">
                결제 완료
              </option>
              <option value="선결제 확인 대기">
                집 앞 배송
              </option>
              <option value="매장 픽업 예정">
                매장 픽업
              </option>
            </select>
          </div>

          <button
            id="refreshButton"
            class="button"
            type="button"
          >
            새로고침
          </button>
        </div>
      </section>

      <section
        id="requestList"
        class="request-list"
      ></section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <script>
    "use strict";

    const sb =
      window.dampickSupabase;

    const loginCard =
      document.getElementById(
        "loginCard"
      );

    const app =
      document.getElementById(
        "app"
      );

    const requestList =
      document.getElementById(
        "requestList"
      );

    const message =
      document.getElementById(
        "message"
      );

    let requests = [];

    document
      .getElementById(
        "loginButton"
      )
      .addEventListener(
        "click",
        login
      );

    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        logout
      );

    document
      .getElementById(
        "refreshButton"
      )
      .addEventListener(
        "click",
        loadRequests
      );

    document
      .getElementById(
        "statusFilter"
      )
      .addEventListener(
        "change",
        renderRequests
      );

    requestList.addEventListener(
      "click",
      handleAction
    );

    initialize();

    async function initialize() {
      if (!sb) {
        showMessage(
          "Supabase 연결정보를 불러오지 못했습니다.",
          "error"
        );
        return;
      }

      const { data } =
        await sb.auth.getSession();

      if (data.session) {
        showApp();
        loadRequests();
      }
    }

    async function login() {
      clearMessage();

      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();

      const password =
        document
          .getElementById(
            "password"
          )
          .value;

      const { error } =
        await sb.auth
          .signInWithPassword({
            email,
            password
          });

      if (error) {
        showMessage(
          error.message ||
          "로그인하지 못했습니다.",
          "error"
        );
        return;
      }

      showApp();
      loadRequests();
    }

    async function logout() {
      await sb.auth.signOut();

      app.classList.add(
        "hidden"
      );

      loginCard.classList.remove(
        "hidden"
      );
    }

    function showApp() {
      loginCard.classList.add(
        "hidden"
      );

      app.classList.remove(
        "hidden"
      );
    }

    async function loadRequests() {
      clearMessage();

      const { data, error } =
        await sb
          .from(
            "checkout_requests"
          )
          .select(`
            *,
            checkout_request_items(
              id,
              order_item_id,
              order_number,
              product_id,
              product_name,
              quantity,
              unit_name,
              unit_price,
              line_total,
              pickup_date,
              created_at
            )
          `)
          .order(
            "updated_at",
            {
              ascending: false
            }
          );

      if (error) {
        showMessage(
          error.message ||
          "신청 목록을 불러오지 못했습니다.",
          "error"
        );
        return;
      }

      requests =
        Array.isArray(data)
          ? data
          : [];

      renderRequests();
    }

    function renderRequests() {
      const filter =
        document
          .getElementById(
            "statusFilter"
          )
          .value;

      const filtered =
        filter === "all"
          ? requests
          : requests.filter(
              function (request) {
                return (
                  request.request_status === filter ||
                  request.payment_status === filter ||
                  request.fulfillment_status === filter
                );
              }
            );

      if (!filtered.length) {
        requestList.innerHTML = `
          <section class="card">
            표시할 결제·배송 신청이 없습니다.
          </section>
        `;
        return;
      }

      requestList.innerHTML =
        filtered
          .map(renderRequest)
          .join("");
    }

    function renderRequest(
      request
    ) {
      const isHome =
        request.receipt_method ===
        "home";

      const isPaid =
        isPaymentCompleted(
          request.payment_status
        );

      const orderNumbers =
        Array.isArray(
          request.order_numbers
        )
          ? request.order_numbers
          : [];

      const items =
        Array.isArray(
          request.checkout_request_items
        )
          ? [
              ...request.checkout_request_items
            ].sort(
              function (a, b) {
                return String(
                  a.pickup_date || ""
                ).localeCompare(
                  String(
                    b.pickup_date || ""
                  )
                );
              }
            )
          : [];

      const itemsHtml =
        items.length
          ? items.map(
              function (item) {
                return `
                  <div class="item-row">
                    <div>
                      <div class="item-name">
                        ${escapeHtml(item.product_name || "상품")}
                      </div>

                      <div class="item-meta">
                        ${Number(item.quantity || 0).toLocaleString("ko-KR")}
                        ${escapeHtml(item.unit_name || "개")}
                        · 픽업
                        ${formatDate(item.pickup_date)}
                        · 주문
                        ${escapeHtml(item.order_number || "")}
                      </div>
                    </div>

                    <div class="item-price">
                      ${formatWon(item.line_total)}
                    </div>
                  </div>
                `;
              }
            ).join("")
          : `
              <div class="item-row">
                이전 버전에서 접수된 신청이라
                선택 상품 상세가 없습니다.
              </div>
            `;

      return `
        <article
          class="
            request-card
            ${isHome ? "home" : ""}
          "
          data-id="${escapeHtml(request.id)}"
        >
          <div class="request-head">
            <div>
              <div class="request-code">
                ${escapeHtml(request.request_code)}
              </div>

              <strong>
                ${escapeHtml(request.nickname_snapshot)}
              </strong>

              <div>
                <span class="badge">
                  ${escapeHtml(
                    getReceiptLabel(
                      request.receipt_method
                    )
                  )}
                </span>

                <span class="badge">
                  ${escapeHtml(
                    getPaymentLabel(
                      request.payment_method
                    )
                  )}
                </span>

                <span class="badge">
                  ${escapeHtml(
                    request.payment_status
                  )}
                </span>

                <span class="badge">
                  ${escapeHtml(
                    request.fulfillment_status
                  )}
                </span>
              </div>
            </div>

            <div class="amount">
              ${formatWon(
                request.final_amount
              )}
            </div>
          </div>

          <div class="item-list">
            ${itemsHtml}
          </div>

          <div class="detail-grid">
            <div class="detail-box">
              <strong>연결된 주문번호</strong>
              ${orderNumbers
                .map(escapeHtml)
                .join("<br>")}
            </div>

            <div class="detail-box">
              <strong>이번 신청금액</strong>
              선택 상품:
              ${formatWon(
                request.product_amount
              )}<br>
              배송비:
              ${
                Number(
                  request.delivery_fee || 0
                ) === 0
                  ? "무료"
                  : formatWon(
                      request.delivery_fee
                    )
              }
            </div>

            ${
              isHome
                ? `
                  <div class="detail-box sensitive">
                    <strong>배송 주소</strong>
                    ${escapeHtml(
                      request.delivery_address
                    )}
                  </div>

                  <div class="detail-box sensitive">
                    <strong>공동현관 출입정보</strong>
                    ${escapeHtml(
                      request.entrance_info
                    )}
                  </div>

                  <div class="detail-box sensitive">
                    <strong>배송 요청사항</strong>
                    ${escapeHtml(
                      request.delivery_request ||
                      "없음"
                    )}
                  </div>
                `
                : ""
            }
          </div>

          <div class="actions">
            <button
              class="button success"
              type="button"
              data-action="payment-complete"
              ${
                isPaid
                  ? "disabled"
                  : ""
              }
            >
              ${
                isPaid
                  ? "결제 완료됨"
                  : "결제 완료 처리"
              }
            </button>

            ${
              isHome
                ? `
                  <button
                    class="button"
                    type="button"
                    data-action="delivery-ready"
                    ${isPaid ? "" : "disabled"}
                  >
                    ${
                      isPaid
                        ? "배송 준비"
                        : "결제 완료 후 배송 준비"
                    }
                  </button>

                  <button
                    class="button secondary"
                    type="button"
                    data-action="delivery-complete"
                    ${isPaid ? "" : "disabled"}
                  >
                    배송 완료
                  </button>
                `
                : `
                  <button
                    class="button secondary"
                    type="button"
                    data-action="pickup-complete"
                    ${isPaid ? "" : "disabled"}
                  >
                    ${
                      isPaid
                        ? "픽업 완료"
                        : "결제 완료 후 픽업"
                    }
                  </button>
                `
            }

            <button
              class="button danger"
              type="button"
              data-action="cancel"
            >
              신청 취소
            </button>
          </div>
        </article>
      `;
    }

    async function handleAction(
      event
    ) {
      const button =
        event.target.closest(
          "button[data-action]"
        );

      if (!button) {
        return;
      }

      const card =
        button.closest(
          ".request-card"
        );

      const id =
        card?.dataset.id;

      const request =
        requests.find(
          function (item) {
            return item.id === id;
          }
        );

      if (!request) {
        return;
      }

      const action =
        button.dataset.action;

      if (
        action === "cancel"
      ) {
        const confirmed =
          window.confirm(
            "이 신청을 취소할까요? 취소된 상품은 고객이 다시 선택할 수 있습니다."
          );

        if (!confirmed) {
          return;
        }
      }

      button.disabled = true;

      try {
        const { data, error } =
          await sb.rpc(
            "process_checkout_request",
            {
              p_request_id:
                request.id,
              p_action:
                action
            }
          );

        if (error) {
          throw error;
        }

        showMessage(
          data?.message ||
          "처리가 완료되었습니다.",
          "success"
        );

        await loadRequests();

      } catch (error) {
        console.error(error);

        showMessage(
          error.message ||
          "처리하지 못했습니다.",
          "error"
        );

      } finally {
        button.disabled = false;
      }
    }

    function getReceiptLabel(
      value
    ) {
      return value === "home"
        ? "집 앞 배송"
        : "매장 픽업";
    }

    function isPaymentCompleted(
      status
    ) {
      const value =
        String(status || "");

      return (
        value.includes(
          "결제 완료"
        ) ||
        value.includes(
          "입금 완료"
        )
      );
    }

    function getPaymentLabel(
      value
    ) {
      const labels = {
        pickup_pay:
          "픽업 시 결제",
        bank_transfer:
          "계좌이체",
        card_online:
          "카드결제"
      };

      return (
        labels[value] ||
        value
      );
    }

    function formatDate(value) {
      if (!value) {
        return "날짜 미정";
      }

      const date =
        new Date(
          String(value)
            .slice(0, 10) +
          "T00:00:00"
        );

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return String(value);
      }

      return new Intl.DateTimeFormat(
        "ko-KR",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      ).format(date);
    }

    function formatWon(value) {
      return (
        Number(value || 0)
          .toLocaleString(
            "ko-KR"
          ) +
        "원"
      );
    }

    function showMessage(
      text,
      type
    ) {
      message.textContent =
        text;

      message.className =
        "message show " +
        type;
    }

    function clearMessage() {
      message.textContent =
        "";

      message.className =
        "message";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
