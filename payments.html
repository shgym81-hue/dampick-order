<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <title>담픽 주문·결제·배송 통합 관리</title>

  <link rel="stylesheet" href="./assets/css/payments.css">
</head>

<body>
  <main class="wrap">
    <section
      id="loginCard"
      class="card"
    >
      <h1>담픽 주문·결제·배송 관리</h1>

      <p>
        기존 담픽 관리자와 같은
        Supabase 관리자 계정으로 로그인하세요.
      </p>

      <label for="email">
        관리자 이메일
      </label>

      <input
        id="email"
        type="email"
        autocomplete="username"
      >

      <label for="password">
        관리자 비밀번호
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
      >

      <div class="actions">
        <button
          id="loginButton"
          class="button"
          type="button"
        >
          관리자 로그인
        </button>

        <a
          class="button secondary"
          href="./admin.html"
        >
          메인 관리자
        </a>
      </div>
    </section>

    <section
      id="app"
      class="hidden"
    >
      <div class="topbar">
        <div>
          <h1>담픽 주문·결제·배송 통합 관리</h1>

          <p>
            관리자가 등록한 모든 주문을 먼저 보여줍니다.
            고객이 별도 신청하지 않은 상품은
            ‘매장 픽업·픽업 시 결제’로 표시됩니다.
          </p>
        </div>

        <div class="actions">
          <a
            class="button secondary"
            href="./admin.html"
          >
            메인 관리자
          </a>

          <a
            class="button light"
            href="./index.html"
          >
            고객 화면
          </a>

          <button
            id="logoutButton"
            class="button danger"
            type="button"
          >
            로그아웃
          </button>
        </div>
      </div>

      <div
        id="message"
        class="message"
      ></div>

      <section class="card">
        <div class="search-grid">
          <div>
            <label for="nicknameSearch">
              고객 닉네임 검색
            </label>

            <input
              id="nicknameSearch"
              type="search"
              placeholder="닉네임을 입력하세요"
              autocomplete="off"
            >
          </div>

          <div>
            <label for="statusFilter">
              표시 조건
            </label>

            <select id="statusFilter">
              <option value="all">
                전체 주문
              </option>

              <option value="default">
                기본 매장 픽업
              </option>

              <option value="payment-wait">
                결제 확인 필요
              </option>

              <option value="home">
                집 앞 배송
              </option>

              <option value="complete">
                완료 주문
              </option>
            </select>
          </div>

          <div class="search-actions">
            <button
              id="searchButton"
              class="button"
              type="button"
            >
              고객 조회
            </button>

            <button
              id="clearButton"
              class="button light"
              type="button"
            >
              전체 보기
            </button>

            <button
              id="refreshButton"
              class="button secondary"
              type="button"
            >
              새로고침
            </button>
          </div>
        </div>

        <div class="summary-strip">
          <div class="summary-box">
            <span>표시 고객</span>
            <strong id="customerCount">0명</strong>
          </div>

          <div class="summary-box">
            <span>표시 주문</span>
            <strong id="orderCount">0건</strong>
          </div>

          <div class="summary-box">
            <span>기본 픽업 상품</span>
            <strong id="defaultItemCount">0개</strong>
          </div>

          <div class="summary-box">
            <span>완료 주문</span>
            <strong id="completedOrderCount">0건</strong>
          </div>
        </div>
      </section>

      <section
        id="customerList"
        class="customer-list"
      ></section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/config.js"></script>

  <script src="./assets/js/payments.js"></script>
</body>
</html>
