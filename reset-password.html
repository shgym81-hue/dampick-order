<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>담픽 관리자 비밀번호 재설정</title>
  <meta name="theme-color" content="#f41468">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #fff7fa 0%, #ffffff 100%);
      color: #202532;
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
    }

    .wrap {
      width: min(500px, 100%);
    }

    .brand {
      margin-bottom: 18px;
      text-align: center;
    }

    .brand-icon {
      display: grid;
      width: 62px;
      height: 62px;
      margin: 0 auto 12px;
      place-items: center;
      border-radius: 20px;
      color: #fff;
      background: linear-gradient(145deg, #ff5a92, #e30a5d);
      box-shadow: 0 14px 30px rgba(216,6,86,.2);
      font-size: 30px;
      font-weight: 950;
    }

    .brand h1 {
      margin: 0;
      color: #f41468;
      font-size: 34px;
      font-weight: 950;
      letter-spacing: -1.5px;
    }

    .brand p {
      margin: 7px 0 0;
      color: #717782;
      font-size: 14px;
    }

    .card {
      padding: 28px;
      border: 1px solid #f0dce4;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 18px 48px rgba(128,37,75,.12);
    }

    h2 {
      margin: 0 0 10px;
      color: #101a38;
      font-size: 25px;
      letter-spacing: -1px;
    }

    .desc {
      margin: 0 0 22px;
      color: #666d79;
      font-size: 14px;
      line-height: 1.7;
      word-break: keep-all;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      color: #101a38;
      font-size: 14px;
      font-weight: 900;
    }

    input {
      width: 100%;
      min-height: 54px;
      padding: 14px 16px;
      border: 1px solid #dfe1e6;
      border-radius: 14px;
      background: #fff;
      color: #202532;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #f41468;
      box-shadow: 0 0 0 4px rgba(244,20,104,.08);
    }

    button {
      width: 100%;
      min-height: 56px;
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(105deg, #ff4d8d, #d80656);
      box-shadow: 0 12px 24px rgba(216,6,86,.2);
      font-size: 17px;
      font-weight: 950;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    .secondary {
      color: #9d174d;
      background: #fff0f5;
      box-shadow: none;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.65;
      word-break: keep-all;
    }

    .message.show { display: block; }
    .message.success { color: #14663b; background: #eaf8ef; }
    .message.error { color: #9e253c; background: #fff0f4; }
    .message.info { color: #604b00; background: #fff8d9; }

    .section[hidden] { display: none; }

    .back-link {
      display: block;
      margin-top: 18px;
      color: #7a7f88;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
    }

    .small-note {
      margin-top: 13px;
      color: #858a94;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .card { padding: 22px 18px; }
      .brand h1 { font-size: 30px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header class="brand">
      <div class="brand-icon">D</div>
      <h1>DAMPICK 담픽</h1>
      <p>관리자 비밀번호 재설정</p>
    </header>

    <section class="card">
      <!-- 1단계: 재설정 메일 요청 -->
      <div id="requestSection" class="section">
        <h2>비밀번호 재설정</h2>
        <p class="desc">
          관리자 이메일을 입력하면 새 비밀번호를 설정할 수 있는
          재설정 메일을 보내드립니다.
        </p>

        <label for="email">관리자 이메일</label>
        <input
          id="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="관리자 이메일 입력"
        >

        <button id="sendButton" type="button">
          비밀번호 재설정 메일 보내기
        </button>

        <div id="requestMessage" class="message"></div>

        <p class="small-note">
          메일을 받은 뒤 가장 최근에 도착한
          <strong>Reset password</strong> 링크를 눌러주세요.
        </p>
      </div>

      <!-- 2단계: 새 비밀번호 입력 -->
      <div id="changeSection" class="section" hidden>
        <h2>새 비밀번호 설정</h2>
        <p class="desc">
          사용할 새 관리자 비밀번호를 두 번 입력해주세요.
        </p>

        <label for="newPassword">새 비밀번호</label>
        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          placeholder="새 비밀번호 8자 이상"
        >

        <label for="confirmPassword">새 비밀번호 확인</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="새 비밀번호 다시 입력"
        >

        <button id="changeButton" type="button">
          비밀번호 변경하기
        </button>

        <div id="changeMessage" class="message"></div>
      </div>

      <!-- 3단계: 완료 -->
      <div id="completeSection" class="section" hidden>
        <h2>변경 완료</h2>
        <p class="desc">
          관리자 비밀번호가 새 비밀번호로 변경되었습니다.
          이제 관리자 페이지에서 새 비밀번호로 로그인하세요.
        </p>

        <a href="./admin.html" style="text-decoration:none;">
          <button type="button">관리자 로그인 페이지로 이동</button>
        </a>
      </div>
    </section>

    <a class="back-link" href="./admin.html">
      ← 담픽 관리자 페이지
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <script>
    "use strict";

    const sb = window.dampickSupabase;

    const requestSection = document.getElementById("requestSection");
    const changeSection = document.getElementById("changeSection");
    const completeSection = document.getElementById("completeSection");

    const emailInput = document.getElementById("email");
    const sendButton = document.getElementById("sendButton");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const changeButton = document.getElementById("changeButton");

    const requestMessage = document.getElementById("requestMessage");
    const changeMessage = document.getElementById("changeMessage");

    init();

    async function init() {
      if (!sb) {
        showMessage(
          requestMessage,
          "Supabase 연결정보를 불러오지 못했습니다. config.js를 확인해주세요.",
          "error"
        );
        sendButton.disabled = true;
        return;
      }

      // 복구 링크로 들어온 경우 Supabase가 URL의 인증정보를 읽어
      // 세션을 생성합니다. 이미 세션이 있으면 바로 비밀번호 변경 화면을 보여줍니다.
      await checkSession();

      sb.auth.onAuthStateChange(function (event, session) {
        if (
          event === "PASSWORD_RECOVERY" ||
          event === "SIGNED_IN" ||
          session
        ) {
          showChangeSection();
        }
      });
    }

    async function checkSession() {
      try {
        const { data, error } = await sb.auth.getSession();

        if (error) {
          console.warn(error);
          return;
        }

        if (data?.session) {
          showChangeSection();
          return;
        }

        // URL에 복구 인증정보가 있는 경우 초기화 시간을 조금 기다립니다.
        if (
          window.location.hash.includes("access_token=") ||
          window.location.search.includes("code=")
        ) {
          showMessage(
            requestMessage,
            "재설정 링크를 확인하고 있습니다. 잠시만 기다려주세요.",
            "info"
          );

          setTimeout(checkSession, 700);
        }
      } catch (error) {
        console.error(error);
      }
    }

    sendButton.addEventListener("click", sendResetEmail);

    emailInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        sendResetEmail();
      }
    });

    changeButton.addEventListener("click", changePassword);

    confirmPasswordInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        changePassword();
      }
    });

    async function sendResetEmail() {
      clearMessage(requestMessage);

      const email = emailInput.value.trim();

      if (!email) {
        showMessage(
          requestMessage,
          "관리자 이메일을 입력해주세요.",
          "error"
        );
        emailInput.focus();
        return;
      }

      if (!isValidEmail(email)) {
        showMessage(
          requestMessage,
          "이메일 형식을 확인해주세요.",
          "error"
        );
        return;
      }

      sendButton.disabled = true;
      sendButton.textContent = "메일을 보내고 있습니다...";

      try {
        const redirectTo =
          window.location.origin +
          window.location.pathname;

        const { error } =
          await sb.auth.resetPasswordForEmail(
            email,
            { redirectTo }
          );

        if (error) {
          throw error;
        }

        showMessage(
          requestMessage,
          "재설정 메일을 보냈습니다. 네이버 메일함에서 가장 최근에 도착한 'Reset your password' 메일을 열고 Reset password를 눌러주세요.",
          "success"
        );

      } catch (error) {
        console.error(error);

        showMessage(
          requestMessage,
          error.message || "재설정 메일을 보내지 못했습니다.",
          "error"
        );

      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "비밀번호 재설정 메일 보내기";
      }
    }

    async function changePassword() {
      clearMessage(changeMessage);

      const password = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password.length < 8) {
        showMessage(
          changeMessage,
          "새 비밀번호는 8자 이상으로 입력해주세요.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          changeMessage,
          "새 비밀번호와 확인 비밀번호가 서로 다릅니다.",
          "error"
        );
        return;
      }

      changeButton.disabled = true;
      changeButton.textContent = "비밀번호를 변경하고 있습니다...";

      try {
        const { error } =
          await sb.auth.updateUser({
            password: password
          });

        if (error) {
          throw error;
        }

        // 변경 후에는 복구 세션을 종료하고
        // 새 비밀번호로 관리자 페이지에서 다시 로그인하게 합니다.
        await sb.auth.signOut();

        requestSection.hidden = true;
        changeSection.hidden = true;
        completeSection.hidden = false;

      } catch (error) {
        console.error(error);

        showMessage(
          changeMessage,
          error.message || "비밀번호를 변경하지 못했습니다. 재설정 메일을 다시 받아 시도해주세요.",
          "error"
        );

      } finally {
        changeButton.disabled = false;
        changeButton.textContent = "비밀번호 변경하기";
      }
    }

    function showChangeSection() {
      requestSection.hidden = true;
      completeSection.hidden = true;
      changeSection.hidden = false;
      newPasswordInput.focus();
    }

    function showMessage(element, text, type) {
      element.textContent = text;
      element.className = "message show " + type;
    }

    function clearMessage(element) {
      element.textContent = "";
      element.className = "message";
    }

    function isValidEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }
  </script>
</body>
</html>
