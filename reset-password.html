<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>담픽 관리자 비밀번호 재설정</title>
  <meta name="theme-color" content="#f41468">

  <link rel="stylesheet" href="./assets/css/reset-password.css">
</head>

<body>
  <main class="wrap">
    <header class="brand">
      <div class="brand-icon">D</div>
      <h1>DAMPICK 담픽</h1>
      <p>관리자 비밀번호 재설정</p>
    </header>

    <section class="card">
      <!-- 1단계: 재설정 메일 요청 -->
      <div id="requestSection" class="section">
        <h2>비밀번호 재설정</h2>
        <p class="desc">
          관리자 이메일을 입력하면 새 비밀번호를 설정할 수 있는
          재설정 메일을 보내드립니다.
        </p>

        <label for="email">관리자 이메일</label>
        <input
          id="email"
          type="email"
          inputmode="email"
          autocomplete="email"
          placeholder="관리자 이메일 입력"
        >

        <button id="sendButton" type="button">
          비밀번호 재설정 메일 보내기
        </button>

        <div id="requestMessage" class="message"></div>

        <p class="small-note">
          메일을 받은 뒤 가장 최근에 도착한
          <strong>Reset password</strong> 링크를 눌러주세요.
        </p>
      </div>

      <!-- 2단계: 새 비밀번호 입력 -->
      <div id="changeSection" class="section" hidden>
        <h2>새 비밀번호 설정</h2>
        <p class="desc">
          사용할 새 관리자 비밀번호를 두 번 입력해주세요.
        </p>

        <label for="newPassword">새 비밀번호</label>
        <input
          id="newPassword"
          type="password"
          autocomplete="new-password"
          placeholder="새 비밀번호 8자 이상"
        >

        <label for="confirmPassword">새 비밀번호 확인</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="새 비밀번호 다시 입력"
        >

        <button id="changeButton" type="button">
          비밀번호 변경하기
        </button>

        <div id="changeMessage" class="message"></div>
      </div>

      <!-- 3단계: 완료 -->
      <div id="completeSection" class="section" hidden>
        <h2>변경 완료</h2>
        <p class="desc">
          관리자 비밀번호가 새 비밀번호로 변경되었습니다.
          이제 관리자 페이지에서 새 비밀번호로 로그인하세요.
        </p>

        <a href="./admin.html" style="text-decoration:none;">
          <button type="button">관리자 로그인 페이지로 이동</button>
        </a>
      </div>
    </section>

    <a class="back-link" href="./admin.html">
      ← 담픽 관리자 페이지
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/config.js"></script>

  <script src="./assets/js/reset-password.js"></script>
</body>
</html>
