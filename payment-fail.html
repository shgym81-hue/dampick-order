<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>담픽 카드결제 실패</title>

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #292733;
      background: #fff7fa;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
    }

    .card {
      width: min(520px, 100%);
      padding: 28px;
      border-radius: 22px;
      background: #fff;
      box-shadow:
        0 18px 48px rgba(186, 39, 96, .13);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #a62840;
    }

    .error {
      margin: 18px 0;
      padding: 16px;
      border-radius: 14px;
      color: #a62840;
      background: #fff0f4;
      line-height: 1.7;
      word-break: keep-all;
    }

    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border-radius: 12px;
      color: #fff;
      background: #ef3f7f;
      font-weight: 900;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>카드결제가 완료되지 않았습니다</h1>

    <div
      id="errorBox"
      class="error"
    ></div>

    <p>
      다시 주문을 조회해 카드결제를 재시도하거나
      계좌이체·픽업할 때 결제를 선택할 수 있습니다.
    </p>

    <a
      id="backLink"
      href="./index.html"
    >
      내 주문으로 돌아가기
    </a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>

  <script>
    "use strict";

    const params =
      new URLSearchParams(
        window.location.search
      );

    const code =
      params.get("code") ||
      "PAYMENT_FAILED";

    const message =
      params.get("message") ||
      "결제를 취소했거나 카드 인증에 실패했습니다.";

    const orderId =
      params.get("orderId") ||
      "";

    const nickname =
      localStorage.getItem(
        "dampickLastNickname"
      ) || "";

    const errorBox =
      document.getElementById(
        "errorBox"
      );

    errorBox.innerHTML = `
      <strong>${escapeHtml(code)}</strong><br>
      ${escapeHtml(message)}
    `;

    const backLink =
      document.getElementById(
        "backLink"
      );

    if (nickname) {
      backLink.href =
        "./index.html?nickname=" +
        encodeURIComponent(nickname);
    }

    markFailed();

    async function markFailed() {
      if (
        !orderId ||
        !window.dampickSupabase
      ) {
        return;
      }

      try {
        await window.dampickSupabase.rpc(
          "mark_card_payment_failed",
          {
            p_request_code:
              orderId,
            p_error_code:
              code,
            p_error_message:
              message
          }
        );
      } catch (error) {
        console.warn(error);
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
